# Production stack: Caddy (TLS + SPA + reverse proxy) -> coordinator, with Litestream backups.
#
#   cp deploy/.env.example deploy/.env   # fill in values
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# First boot on a fresh VM restores the DB from the replica if one exists (see restore service).

services:
  restore:
    image: litestream/litestream:0.3.13
    command: ["restore", "-if-db-not-exists", "-if-replica-exists", "-config", "/etc/litestream.yml", "/data/exchange.db"]
    env_file: .env
    volumes:
      - ie-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro

  coordinator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.coordinator
    restart: unless-stopped
    env_file: .env
    environment:
      IE_ENV: prod
      IE_DB_PATH: /data/exchange.db
      IE_PUBLIC_URL: https://${IE_DOMAIN}
    volumes:
      - ie-data:/data
    depends_on:
      restore:
        condition: service_completed_successfully

  litestream:
    image: litestream/litestream:0.3.13
    restart: unless-stopped
    command: ["replicate", "-config", "/etc/litestream.yml"]
    env_file: .env
    volumes:
      - ie-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    depends_on:
      - coordinator

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      IE_DOMAIN: ${IE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - coordinator

volumes:
  ie-data:
  caddy-data:
  caddy-config:
