name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # llama-cpp-python is skipped: unit tests don't load models and it needs a C++ build
        run: |
          pip install fastapi uvicorn "websockets>=13,<14" "pydantic>=2.9,<3" "httpx>=0.27,<1" \
            "pynacl>=1.5,<2" "cryptography>=43,<47" "huggingface-hub>=0.25,<1" "sse-starlette>=2,<3" \
            "cbor2>=5.6,<6" certifi openai pytest pytest-asyncio
          pip install --no-deps -e .
      - name: Unit tests
        # Scripts and SDK tests that need a running coordinator are excluded
        run: >
          pytest tests -q
          --ignore=tests/load_test.py
          --ignore=tests/local_e2e_test.py
          --ignore=tests/test_integration.py
          --ignore=tests/test_preferences.py
          --deselect tests/test_openai_sdk.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
