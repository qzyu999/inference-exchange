<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -4 52 55" width="48" height="48">
  <!--
    Compact 3D stella octangula icon.
    Same projection as the full logo, scaled to 48x48.
    Scale factor: ~0.24 from the 200x200 version.
  -->

  <!-- Up tetra faces (green) -->
  <polygon points="17.9,-0.9 45.1,26 28.3,34.9" fill="#4B9563" fill-opacity="0.18"/>
  <polygon points="17.9,-0.9 28.3,34.9 4.7,36" fill="#4B9563" fill-opacity="0.22"/>
  <polygon points="45.1,26 4.7,36 28.3,34.9" fill="#4B9563" fill-opacity="0.18"/>

  <!-- Down tetra faces (red) -->
  <polygon points="19.7,13.1 43.3,12 30.1,48.9" fill="#B9473C" fill-opacity="0.18"/>
  <polygon points="19.7,13.1 30.1,48.9 2.9,22" fill="#B9473C" fill-opacity="0.22"/>
  <polygon points="43.3,12 2.9,22 30.1,48.9" fill="#B9473C" fill-opacity="0.18"/>

  <!-- Up tetra edges (green) -->
  <line x1="17.9" y1="-0.9" x2="45.1" y2="26" stroke="#4B9563" stroke-width="1.5"/>
  <line x1="17.9" y1="-0.9" x2="4.7" y2="36" stroke="#4B9563" stroke-width="1.5"/>
  <line x1="17.9" y1="-0.9" x2="28.3" y2="34.9" stroke="#4B9563" stroke-width="1.5"/>
  <line x1="45.1" y1="26" x2="4.7" y2="36" stroke="#4B9563" stroke-width="1.5"/>
  <line x1="45.1" y1="26" x2="28.3" y2="34.9" stroke="#4B9563" stroke-width="1.5"/>
  <line x1="4.7" y1="36" x2="28.3" y2="34.9" stroke="#4B9563" stroke-width="1.5"/>

  <!-- Down tetra edges (red) -->
  <line x1="19.7" y1="13.1" x2="43.3" y2="12" stroke="#B9473C" stroke-width="1.5"/>
  <line x1="19.7" y1="13.1" x2="2.9" y2="22" stroke="#B9473C" stroke-width="1.5"/>
  <line x1="19.7" y1="13.1" x2="30.1" y2="48.9" stroke="#B9473C" stroke-width="1.5"/>
  <line x1="43.3" y1="12" x2="2.9" y2="22" stroke="#B9473C" stroke-width="1.5"/>
  <line x1="43.3" y1="12" x2="30.1" y2="48.9" stroke="#B9473C" stroke-width="1.5"/>
  <line x1="2.9" y1="22" x2="30.1" y2="48.9" stroke="#B9473C" stroke-width="1.5"/>

  <!-- Octahedron intersection (white, subtle) -->
  <polygon points="31.5,12.5 11.3,17.5 23.1,17 24.9,31 36.7,30.5 16.5,35.5"
    fill="none" stroke="white" stroke-width="0.6" stroke-opacity="0.4"/>
</svg>
