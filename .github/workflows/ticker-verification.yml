name: Ticker verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download pinned TLC release
        run: |
          curl --fail --location https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar -o /tmp/tla2tools.jar
          echo 'e1f11b75c4b5bc4478ba0ac5cb6ae28e40a01b0016bc33e0aa97da22dfdbcd7f  /tmp/tla2tools.jar' | sha256sum -c -
      - name: Check snapshot state machine
        working-directory: formal/ticker
        run: java -cp /tmp/tla2tools.jar tlc2.TLC -workers 2 Snapshot.tla
  browser:
    # Playwright 1.51 supports Ubuntu 24.04, but not the newer latest runner.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: web
      - name: Check catalog interactions and mobile layout
        run: |
          npm --prefix web run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          VITE_TEST_PID=$!
          trap 'kill "$VITE_TEST_PID" 2>/dev/null || true' EXIT
          python web/scripts/check-exchange-catalog.py
