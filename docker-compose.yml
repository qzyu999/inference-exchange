# Multi-provider demo + coordinator deployment
#
# NOTE: This uses the simple provider (inference_exchange.provider), not
# the production OCIP agent (ocip_agent). For production with hardened
# inference and E2E encryption, use the OCIP agent path directly.
#
# Start coordinator:   docker compose up coordinator
# Start everything:    docker compose up
# Scale providers:     docker compose up --scale provider-cheap=3
#
# Coordinator UI: http://localhost:8000
# Admin UI:       http://localhost:8000/admin.html

services:
  coordinator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ie-data:/root/.inference-exchange
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8000/health'); assert r.status_code==200"]
      interval: 30s
      timeout: 5s
      start_period: 10s

  provider-cheap:
    build:
      context: .
      dockerfile: Dockerfile.provider
    environment:
      PROVIDER_NAME: "cheap-node ($0.08)"
      PRICE_OUTPUT: "0.08"
      MAX_CONCURRENT: "2"
      COORDINATOR_URL: "ws://coordinator:8000/ws/provider"
    volumes:
      - models:/root/.inference-exchange/models:ro
    depends_on:
      coordinator:
        condition: service_healthy

  provider-fast:
    build:
      context: .
      dockerfile: Dockerfile.provider
    environment:
      PROVIDER_NAME: "fast-node ($0.20)"
      PRICE_OUTPUT: "0.20"
      MAX_CONCURRENT: "4"
      COORDINATOR_URL: "ws://coordinator:8000/ws/provider"
    volumes:
      - models:/root/.inference-exchange/models:ro
    depends_on:
      coordinator:
        condition: service_healthy

  provider-premium:
    build:
      context: .
      dockerfile: Dockerfile.provider
    environment:
      PROVIDER_NAME: "premium-node ($0.50)"
      PRICE_OUTPUT: "0.50"
      MAX_CONCURRENT: "3"
      COORDINATOR_URL: "ws://coordinator:8000/ws/provider"
    volumes:
      - models:/root/.inference-exchange/models:ro
    depends_on:
      coordinator:
        condition: service_healthy

volumes:
  ie-data:
  models:
